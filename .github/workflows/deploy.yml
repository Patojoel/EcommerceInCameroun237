name: 🚀 Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🌍 Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🔗 Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.deploy_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Post-deploy health check
  # ──────────────────────────────────────────
  health-check:
    name: 🏥 Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: 🔍 Check homepage
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ vars.PRODUCTION_URL }}" || echo "000")
          echo "Homepage status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Homepage returned status $STATUS"
          fi

      - name: 🔍 Check API health
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/api/products?limit=1" || echo "000")
          echo "API Products status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API Products returned status $STATUS"
          fi

      - name: 🔍 Check sitemap
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/sitemap.xml" || echo "000")
          echo "Sitemap status: $STATUS"

      - name: 🔍 Check robots.txt
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/robots.txt" || echo "000")
          echo "Robots.txt status: $STATUS"

      - name: 📊 Health Check Summary
        run: |
          echo "## 🏥 Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| API Products | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Sitemap | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Robots.txt | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
